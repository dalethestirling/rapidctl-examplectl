---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: examplectl-mcp-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: examplectl-mcp
  template:
    metadata:
      labels:
        app: examplectl-mcp
    spec:
      serviceAccountName: examplectl-mcp-sa
      containers:
      - name: mcp-server
        image: dalethestirling/examplectl:latest # Placeholder image
        command: ["examplectl", "mcp"]
        env:
        - name: RAPIDCTL_EXEC_MODE
          value: "kubernetes"
        ports:
        - containerPort: 8080
          name: mcp
---
apiVersion: v1
kind: Service
metadata:
  name: examplectl-mcp-service
  namespace: default
spec:
  selector:
    app: examplectl-mcp
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: mcp
